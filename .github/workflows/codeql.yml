name: CodeQL

# GitHub's code scanning for C#: looks for security problems like injection, unsafe
# deserialisation and path traversal. Findings appear under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly discovered kinds of problem are caught in code that hasn't changed
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: dotnet build Islet.sln -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
