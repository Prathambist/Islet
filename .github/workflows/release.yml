name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test tests/Islet.Tests/Islet.Tests.csproj -c Release

      - name: Build & Publish Self-Contained App
        # Stamp the tag (v1.2.0 -> 1.2.0) into the exe so the in-app updater can compare versions.
        # ReadyToRun precompiles the app, so the first hover or notification doesn't stall on the JIT.
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { $version = "0.0.0" }
          dotnet publish src/Islet/Islet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:Version=$version -o ./publish

      # Installs from before the rename to Islet only accept an update with MusicIsland.exe in it;
      # this tiny stand-in starts Islet, which then moves itself to its own folder
      - name: Build Stand-in For Old Installs
        run: |
          dotnet build src/Islet.LegacyLauncher/Islet.LegacyLauncher.csproj -c Release -o ./launcher
          Copy-Item ./launcher/MusicIsland.exe ./publish/

      - name: Create Release Zip
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./Islet-win-x64.zip

      # Islet's updater and install.ps1 refuse a zip without a valid signature, so a release
      # can't be published unsigned. The key is a repository secret; see docs/RELEASING.md.
      - name: Sign Release Zip
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) { throw "The RELEASE_SIGNING_KEY secret isn't set. See docs/RELEASING.md." }

          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.ImportFromPem($env:RELEASE_SIGNING_KEY)
          $bytes = [IO.File]::ReadAllBytes("Islet-win-x64.zip")
          $signature = $rsa.SignData($bytes, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          [IO.File]::WriteAllText("Islet-win-x64.zip.sig", [Convert]::ToBase64String($signature))

          # A plain checksum too, for anyone checking a download by hand
          "$((Get-FileHash Islet-win-x64.zip -Algorithm SHA256).Hash.ToLower())  Islet-win-x64.zip" | Set-Content Islet-win-x64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Islet ${{ github.ref_name }}
          files: |
            Islet-win-x64.zip
            Islet-win-x64.zip.sig
            Islet-win-x64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
